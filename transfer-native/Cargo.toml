[package]
name = "filebeam-transfer-native"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Native async runtime and durable state for Filebeam transfers"

[dependencies]
anyhow = "1.0.98"
base64 = "0.22.1"
bytes = "1"
filebeam-encryption = { path = "../encryption" }
filebeam-transfer = { path = "../transfer" }
futures-util = "0.3"
fs2 = "0.4.3"
hex = "0.4.3"
reqwest = { version = "0.12.20", default-features = false, features = ["blocking", "json", "rustls-tls", "stream"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.11.0"
thiserror = "2.0.12"
tokio = { version = "1.47.1", features = ["fs", "macros", "rt-multi-thread", "sync", "time"] }
tokio-util = { version = "0.7.16", features = ["rt"] }
time = { version = "0.3.41", features = ["parsing"] }
tempfile = "3.20.0"
uuid = { version = "1.18.1", features = ["v4"] }
zeroize = "1.8.1"
zip = { version = "4.6.1", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_Threading"] }
