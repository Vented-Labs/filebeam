[package]
name = "beam"
version = "0.1.0"
edition = "2024"
license = "MIT"

[[bin]]
name = "beam"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.98"
base64 = "0.22.1"
clap = { version = "4.5.40", features = ["derive", "env"] }
crossterm = "0.28.1"
ctrlc = { version = "3.5.2", features = ["termination"] }
dirs = "6.0.0"
ed25519-dalek = "2.1.1"
filebeam-encryption = { path = "../encryption" }
hex = "0.4.3"
ratatui = "0.29.0"
reqwest = { version = "0.12.20", default-features = false, features = ["blocking", "json", "rustls-tls"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
semver = "1.0.26"
sha2 = "0.11.0"
flate2 = "1.1.2"
tar = "0.4.44"
tempfile = "3.20.0"
time = { version = "0.3.41", features = ["parsing"] }
thiserror = "2.0.12"
toml = "0.8.23"
url = "2.5.4"
zeroize = "1.8.1"
unicode-segmentation = "1.13.3"
unicode-width = "=0.2.0"
zip = { version = "4.6.1", default-features = false, features = ["deflate"] }

[dev-dependencies]
assert_matches = "1.5.0"
