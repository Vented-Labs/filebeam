[package]
name = "filebeam-daemon"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Local Filebeam daemon ownership and authenticated IPC"

[[bin]]
name = "filebeamd"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.98"
base64 = "0.22"
dirs = "6.0.0"
ed25519-dalek = "2"
filebeam-client-core = { path = "../client-core" }
filebeam-transfer = { path = "../transfer" }
filebeam-transfer-native = { path = "../transfer-native" }
fs2 = "0.4.3"
getrandom = "0.2"
hmac = "0.12"
libc = "0.2"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tempfile = "3.20.0"
sha2 = "0.10"
tokio = { version = "1", features = ["time"] }
hex = "0.4"
uuid = { version = "1.18.1", features = ["v4", "serde"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Threading"] }

[dev-dependencies]
filebeam-encryption = { path = "../encryption" }
rcgen = "0.14.10"
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std"] }
tempfile = "3.20.0"
