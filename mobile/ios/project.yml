name: Filebeam
options:
  minimumXcodeGenVersion: 2.41.0
  deploymentTarget: { iOS: '17.0' }
settings:
  base:
    SWIFT_VERSION: '6.0'
    SWIFT_STRICT_CONCURRENCY: complete
    IPHONEOS_DEPLOYMENT_TARGET: '17.0'
    TARGETED_DEVICE_FAMILY: '1,2'
    MARKETING_VERSION: '1.0.0'
    CURRENT_PROJECT_VERSION: '1'
packages:
  FilebeamCore: { path: Packages/FilebeamCore }
  FilebeamDomain: { path: Packages/FilebeamDomain }
targets:
  Filebeam:
    type: application
    platform: iOS
    sources:
      - App
      - Features
      - path: Platform
        excludes:
          - '**/Package.swift'
          - '**/PortableTests/**'
          - '**/.build/**'
      - path: ShareExtension/Shared
      - DesignSystem
      - PreviewSupport
      - Resources
      - path: Config/PrivacyInfo.xcprivacy
        buildPhase: resources
    info: { path: Config/Filebeam-Info.plist }
    entitlements: { path: Config/Filebeam.entitlements }
    settings:
      base: { PRODUCT_BUNDLE_IDENTIFIER: io.filebeam.ios, PRODUCT_MODULE_NAME: Filebeam, APP_GROUP_IDENTIFIER: group.io.filebeam.ios, ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon }
      configs:
        Debug: { PRODUCT_BUNDLE_IDENTIFIER: io.filebeam.ios.debug, APP_GROUP_IDENTIFIER: group.io.filebeam.ios.debug }
    dependencies:
      - package: FilebeamCore
      - package: FilebeamDomain
      - target: ShareExtension
        embed: true
  ShareExtension:
    type: app-extension
    platform: iOS
    sources: [ShareExtension]
    info: { path: Config/ShareExtension-Info.plist }
    entitlements: { path: Config/ShareExtension.entitlements }
    settings:
      base: { PRODUCT_BUNDLE_IDENTIFIER: io.filebeam.ios.share, PRODUCT_MODULE_NAME: ShareExtension, APP_GROUP_IDENTIFIER: group.io.filebeam.ios }
      configs:
        Debug: { PRODUCT_BUNDLE_IDENTIFIER: io.filebeam.ios.debug.share, APP_GROUP_IDENTIFIER: group.io.filebeam.ios.debug }
    dependencies: [{ package: FilebeamDomain }]
  FilebeamTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies: [{ target: Filebeam }, { package: FilebeamDomain }, { package: FilebeamCore }]
  FilebeamUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies: [{ target: Filebeam }]
schemes:
  Filebeam:
    build: { targets: { Filebeam: all, ShareExtension: all } }
    test: { targets: [FilebeamTests, FilebeamUITests] }
