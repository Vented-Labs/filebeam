version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 5
    groups:
      github-actions:
        patterns:
          - '*'
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    ignore:
      # vue-tsc still requires the JavaScript compiler API removed in TypeScript 7.
      - dependency-name: typescript
        versions: ['>=7.0.0 <8.0.0']
  - package-ecosystem: composer
    directory: /backend
    schedule:
      interval: weekly
  - package-ecosystem: cargo
    directory: /encryption
    schedule:
      interval: weekly
