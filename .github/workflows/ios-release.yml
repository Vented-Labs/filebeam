name: iOS distribution
on:
  workflow_dispatch:
    inputs:
      ref: { description: Existing master vX.Y.Z release tag to distribute, required: true, type: string }
      distribution: { description: App Store Connect destination, required: true, default: testflight, type: choice, options: [testflight, app-store] }
permissions: { contents: read }
concurrency:
  group: ios-distribution-${{ inputs.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      commit: ${{ steps.tag.outputs.commit }}
    steps:
      - uses: useblacksmith/checkout@0647fdbab2614a5eb86d2971070e325060d91056 # v1
        with:
          persist-credentials: false
          ref: refs/heads/master
          fetch-depth: 0
          fetch-tags: true
      - id: tag
        env:
          RELEASE_TAG: ${{ inputs.ref }}
        run: |
          set -euo pipefail
          commit=$(bash scripts/release/validate-ref.sh "$RELEASE_TAG")
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"
  test:
    needs: validate
    uses: ./.github/workflows/ios-ci.yml
    with: { ref: '${{ needs.validate.outputs.commit }}' }
  distribute:
    needs: [validate, test]
    if: needs.test.result == 'success'
    runs-on: blacksmith-6vcpu-macos-15
    environment: ios-release
    timeout-minutes: 45
    steps:
      - uses: useblacksmith/checkout@0647fdbab2614a5eb86d2971070e325060d91056 # v1
        with: { persist-credentials: false, ref: '${{ needs.validate.outputs.commit }}' }
      - name: Import protected signing material
        env:
          CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILES_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILES_BASE64 }}
          SIGNING_XCCONFIG_BASE64: ${{ secrets.IOS_SIGNING_XCCONFIG_BASE64 }}
          EXPORT_OPTIONS_BASE64: ${{ secrets.IOS_EXPORT_OPTIONS_PLIST_BASE64 }}
        run: |
          set -euo pipefail
          umask 077
          [[ -n "$CERTIFICATE_BASE64" && -n "$CERTIFICATE_PASSWORD" && -n "$PROFILES_BASE64" && -n "$SIGNING_XCCONFIG_BASE64" && -n "$EXPORT_OPTIONS_BASE64" ]]
          security create-keychain -p "$CERTIFICATE_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$CERTIFICATE_PASSWORD" build.keychain
          printf '%s' "$CERTIFICATE_BASE64" | base64 -D > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k build.keychain -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security list-keychain -d user -s build.keychain login.keychain
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$CERTIFICATE_PASSWORD" build.keychain
          profiles="$RUNNER_TEMP/profiles"
          mkdir -p "$profiles" "$HOME/Library/MobileDevice/Provisioning Profiles"
          printf '%s' "$PROFILES_BASE64" | base64 -D | tar -xzf - -C "$profiles"
          shopt -s nullglob
          profile_files=("$profiles"/*.mobileprovision)
          ((${#profile_files[@]} >= 2))
          : > "$RUNNER_TEMP/installed-profiles"
          for profile in "${profile_files[@]}"; do
            plist=$(security cms -D -i "$profile")
            uuid=$(/usr/libexec/PlistBuddy -c 'Print :UUID' /dev/stdin <<<"$plist")
            target="$HOME/Library/MobileDevice/Provisioning Profiles/$uuid.mobileprovision"
            install -m 0600 "$profile" "$target"
            printf '%s\n' "$target" >> "$RUNNER_TEMP/installed-profiles"
          done
          printf '%s' "$SIGNING_XCCONFIG_BASE64" | base64 -D > "$RUNNER_TEMP/signing.xcconfig"
          printf '%s' "$EXPORT_OPTIONS_BASE64" | base64 -D > "$RUNNER_TEMP/ExportOptions.plist"
          printf 'IOS_SIGNING_XCCONFIG=%s\nIOS_EXPORT_OPTIONS_PLIST=%s\n' "$RUNNER_TEMP/signing.xcconfig" "$RUNNER_TEMP/ExportOptions.plist" >> "$GITHUB_ENV"
      - name: Archive and export signed IPA
        env:
          IOS_RELEASE_COMMIT: ${{ needs.validate.outputs.commit }}
          IOS_TEAM_ID: ${{ vars.IOS_TEAM_ID }}
          IOS_MARKETING_VERSION: ${{ inputs.ref }}
          IOS_BUILD_NUMBER: ${{ github.run_number }}
        run: |
          bash scripts/ios/archive.sh
          bash scripts/ios/write-provenance.sh dist/ios/provenance.json
          bash scripts/ios/export.sh
      - name: Upload to App Store Connect
        env:
          API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_ISSUER: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          set -euo pipefail
          [[ -n "$API_KEY" && -n "$API_KEY_ID" && -n "$API_ISSUER" ]]
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$API_KEY" | base64 -D > "$HOME/.appstoreconnect/private_keys/AuthKey_$API_KEY_ID.p8"
          ipa=$(find dist/ios/export -maxdepth 1 -name '*.ipa' -type f -print -quit)
          [[ -n "$ipa" ]]
          xcrun iTMSTransporter -m upload -assetFile "$ipa" -apiKey "$API_KEY_ID" -apiIssuer "$API_ISSUER"
      - if: always()
        name: Remove signing material
        run: |
          rm -f "$RUNNER_TEMP/certificate.p12" "$RUNNER_TEMP/signing.xcconfig" "$RUNNER_TEMP/ExportOptions.plist"
          [[ -f "$RUNNER_TEMP/installed-profiles" ]] && xargs -I{} rm -f "{}" < "$RUNNER_TEMP/installed-profiles" || true
          rm -rf "$HOME/.appstoreconnect/private_keys" "$RUNNER_TEMP/profiles"
          security delete-keychain build.keychain || true
