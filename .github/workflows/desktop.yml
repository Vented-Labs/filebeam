name: Filebeam Desktop

on:
  pull_request:
  workflow_call:
    inputs:
      tag: {required: true, type: string}
      commit: {required: true, type: string}
      publish: {required: true, type: boolean}
    outputs:
      artifact_name: {value: '${{ jobs.publish.outputs.artifact_name }}'}
      artifact_path: {value: '${{ jobs.publish.outputs.artifact_path }}'}
  workflow_dispatch:
    inputs:
      tag: {description: 'Existing vX.Y.Z tag', required: true, type: string}
      publish: {description: 'Produce signed release installers and publish the catalog', required: true, default: false, type: boolean}

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.event_name == 'pull_request' && github.ref || 'release-catalog' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    if: github.event_name != 'pull_request'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    environment: ${{ (inputs.publish || github.event.inputs.publish == 'true') && 'release' || '' }}
    outputs: {tag: '${{ steps.ref.outputs.tag }}', commit: '${{ steps.ref.outputs.commit }}'}
    steps:
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1
        with: {persist-credentials: false, ref: refs/heads/master, fetch-depth: 0, fetch-tags: true}
      - id: ref
        env: {TAG: '${{ inputs.tag || github.event.inputs.tag }}', COMMIT: '${{ inputs.commit }}'}
        run: |
          commit=$(bash scripts/release/validate-ref.sh "$TAG")
          [[ -z "$COMMIT" || "$COMMIT" == "$commit" ]]
          printf 'tag=%s\ncommit=%s\n' "$TAG" "$commit" >> "$GITHUB_OUTPUT"
      - name: Check release signing configuration
        if: inputs.publish || github.event.inputs.publish == 'true'
        env:
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
          RELEASE_PUBLIC_KEY: ${{ secrets.RELEASE_PUBLIC_KEY }}
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
        run: bash scripts/desktop/check-signing.sh

  changes:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs: {relevant: '${{ steps.paths.outputs.relevant }}'}
    steps:
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1
        with: {persist-credentials: false, fetch-depth: 0}
      - id: paths
        env: {BASE: '${{ github.event.pull_request.base.sha }}'}
        run: |
          if [[ "${{ github.event_name }}" != pull_request ]]; then printf 'relevant=true\n' >> "$GITHUB_OUTPUT"; exit 0; fi
          paths=$(git diff --name-only "$BASE" HEAD)
          if grep -Eq '^(desktop/|crates/|backend/|icons/|docker/desktop/|scripts/(desktop|cli|native)/|scripts/release/|\.github/workflows/(desktop|release)\.yml$)' <<< "$paths"; then value=true; else value=false; fi
          printf 'relevant=%s\n' "$value" >> "$GITHUB_OUTPUT"

  targets:
    needs: [validate, changes]
    if: ${{ !cancelled() && needs.changes.outputs.relevant == 'true' && (github.event_name == 'pull_request' || needs.validate.result == 'success') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: blacksmith-4vcpu-ubuntu-2404, target: x86_64-unknown-linux-gnu, os: linux, arch: x86_64, suffix: ''}
          - {runner: blacksmith-4vcpu-ubuntu-2404-arm, target: aarch64-unknown-linux-gnu, os: linux, arch: aarch64, suffix: ''}
          - {runner: blacksmith-6vcpu-macos-15, target: aarch64-apple-darwin, os: macos, arch: aarch64, suffix: ''}
          - {runner: blacksmith-6vcpu-macos-15, target: x86_64-apple-darwin, os: macos, arch: x86_64, suffix: ''}
          - {runner: blacksmith-4vcpu-windows-2025, target: x86_64-pc-windows-msvc, os: windows, arch: x86_64, suffix: '.exe'}
    runs-on: ${{ matrix.runner }}
    environment: ${{ (inputs.publish || github.event.inputs.publish == 'true') && 'release' || '' }}
    timeout-minutes: 90
    env:
      FILEBEAM_RELEASE_VERSION: ${{ needs.validate.outputs.tag || 'v0.1.0' }}
      FILEBEAM_RELEASE_TAG: ${{ needs.validate.outputs.tag || 'v0.1.0' }}
      FILEBEAM_RELEASE_SHA: ${{ needs.validate.outputs.commit || github.event.pull_request.head.sha }}
      FILEBEAM_RELEASE_PUBLIC_KEY: ${{ secrets.RELEASE_PUBLIC_KEY }}
      CARGO_BUILD_JOBS: '2'
      MACOSX_DEPLOYMENT_TARGET: '11.0'
    steps:
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1
        with: {persist-credentials: false, dissociate: true, ref: '${{ needs.validate.outputs.commit || github.event.pull_request.head.sha }}'}
      - name: Install Rust 1.98 and native build dependencies
        if: runner.os != 'Linux'
        shell: bash
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          rustup default 1.98.0
          rustup component add rustfmt clippy
          rustup target add '${{ matrix.target }}'
          if [[ "$RUNNER_OS" == macOS ]]; then brew install pkg-config; fi
          if [[ "$RUNNER_OS" == Windows ]]; then
            choco install llvm nsis --no-progress --yes
            printf '%s\n' '/c/Program Files (x86)/NSIS' >> "$GITHUB_PATH"
          fi
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/filebeam/desktop
            ~/.cargo/registry
            ~/.cargo/git
            desktop/target
          key: desktop-${{ matrix.target }}-rust1.98.0-${{ hashFiles('desktop/Cargo.lock', 'desktop/Cargo.toml', 'crates/**/Cargo.toml', 'docker/desktop/Dockerfile') }}-${{ github.sha }}
          restore-keys: desktop-${{ matrix.target }}-rust1.98.0-${{ hashFiles('desktop/Cargo.lock', 'desktop/Cargo.toml', 'crates/**/Cargo.toml', 'docker/desktop/Dockerfile') }}-
      - name: Build and test in the bounded Linux container
        if: runner.os == 'Linux'
        run: bash scripts/desktop/run.sh bash scripts/desktop/ci-build.sh '${{ matrix.target }}' dist/desktop
      - name: Build and test on the native runner
        if: runner.os != 'Linux'
        shell: bash
        run: bash scripts/desktop/ci-build.sh '${{ matrix.target }}' dist/desktop
        env:
          FILEBEAM_BINARY_SUFFIX: ${{ matrix.suffix }}
          FILEBEAM_DESKTOP_BUILD_ONLY: ${{ matrix.target == 'x86_64-apple-darwin' && '1' || '0' }}
      - name: Desktop transfer E2E and packaging contracts
        if: runner.os == 'Linux'
        run: |
          bash scripts/desktop/transfer.test.sh
          bash scripts/desktop/run.sh bash -ceu 'bash scripts/desktop/run.test.sh; bash scripts/desktop/catalog.test.sh'
      - uses: ./.github/actions/setup-php
        if: runner.os == 'Linux'
      - name: Desktop and CLI E2E against Laravel
        if: runner.os == 'Linux'
        run: |
          bash scripts/desktop/run.sh bash scripts/desktop/ci-e2e.sh dist/native-tests
          python3 scripts/desktop/backend.test.py --desktop dist/native-tests/native_acceptance --services dist/native-tests/services_acceptance --cli dist/native-tests/beam
      - name: Install pinned AppImage tooling
        if: runner.os == 'Linux'
        run: |
          bash scripts/desktop/install-appimagetool.sh '${{ matrix.arch }}' dist/desktop-tools
      - name: Prepare native signing
        if: (inputs.publish || github.event.inputs.publish == 'true') && runner.os != 'Linux'
        shell: bash
        env:
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER: ${{ secrets.APPLE_NOTARY_ISSUER }}
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
        run: bash scripts/desktop/prepare-signing.sh
      - name: Make native installers and updater archives
        shell: bash
        env:
          ARCH: ${{ matrix.arch }}
          TAG: ${{ needs.validate.outputs.tag || 'v0.1.0' }}
          FILEBEAM_DESKTOP_UNSIGNED: ${{ (inputs.publish || github.event.inputs.publish == 'true') && '0' || '1' }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          WINDOWS_SIGNING_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PASSWORD }}
        run: |
          case '${{ matrix.os }}' in
            linux)
              bash scripts/desktop/run.sh env TAG="$TAG" ARCH="$ARCH" bash -ceu '
                export PATH="/workspace/dist/desktop-tools:$PATH"
                bash scripts/desktop/package-linux-installer.sh dist/desktop/filebeam "$TAG" dist/desktop
                bash scripts/desktop/package-update-payload.sh "$TAG" linux "$ARCH" "dist/desktop/filebeam-desktop-$TAG-linux-$ARCH.AppImage" dist/desktop
                APPIMAGE_EXTRACT_AND_RUN=1 "dist/desktop/filebeam-desktop-$TAG-linux-$ARCH.AppImage" --version
              '
              ;;
            macos) bash scripts/desktop/package-macos-installer.sh dist/desktop/filebeam "$TAG" dist/desktop ;;
            windows) bash scripts/desktop/package-windows-installer.sh dist/desktop/filebeam.exe "$TAG" dist/desktop ;;
          esac
      - name: Remove signing material
        if: always() && (inputs.publish || github.event.inputs.publish == 'true') && runner.os != 'Linux'
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == macOS ]]; then security delete-keychain "$RUNNER_TEMP/filebeam.keychain-db" || true; fi
          rm -f "$RUNNER_TEMP/filebeam.p12" "$RUNNER_TEMP/filebeam.pfx" "$RUNNER_TEMP/filebeam-notary.p8"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: desktop-${{ matrix.os }}-${{ matrix.arch }}-${{ needs.validate.outputs.tag || github.event.pull_request.head.sha }}
          path: dist/desktop/filebeam-desktop-*
          if-no-files-found: error

  publish:
    if: inputs.publish || github.event.inputs.publish == 'true'
    needs: [validate, targets]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    environment: release
    permissions: {contents: read}
    outputs: {artifact_name: 'desktop-release-${{ needs.validate.outputs.tag }}', artifact_path: 'dist/desktop'}
    steps:
      - uses: useblacksmith/checkout@25227e61ff9dafe400e22fa487b673eac4e4409a # v1
        with: {persist-credentials: false, ref: '${{ needs.validate.outputs.commit }}'}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with: {pattern: 'desktop-*-*-${{ needs.validate.outputs.tag }}', path: dist/download, merge-multiple: true}
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with: {php-version: '8.5', extensions: sodium, coverage: none}
      - name: Verify and publish the signed desktop catalog
        run: |
          php scripts/release/desktop-write-release.php "$RELEASE_TAG" dist/download dist/download/release.json
          scripts/release/desktop-publish.sh "$RELEASE_TAG" dist/download
        env:
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RELEASE_PUBLIC_KEY: ${{ secrets.RELEASE_PUBLIC_KEY }}
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with: {name: 'desktop-release-${{ needs.validate.outputs.tag }}', path: dist/download/, if-no-files-found: error}

  desktop:
    needs: [validate, changes, targets, publish]
    if: always()
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - env:
          VALIDATE: ${{ needs.validate.result }}
          RELEVANT: ${{ needs.changes.outputs.relevant }}
          CHANGES: ${{ needs.changes.result }}
          TARGETS: ${{ needs.targets.result }}
          PUBLISH: ${{ needs.publish.result }}
          REQUESTED_PUBLISH: ${{ inputs.publish || github.event.inputs.publish }}
        run: |
          [[ "$VALIDATE" == success || "${{ github.event_name }}" == pull_request ]]
          [[ "$CHANGES" == success ]]
          if [[ "$RELEVANT" == true ]]; then [[ "$TARGETS" == success ]]; else [[ "$TARGETS" == skipped ]]; fi
          [[ "$REQUESTED_PUBLISH" != true || "$PUBLISH" == success ]]
