name: Tests

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_call:
    inputs:
      ref:
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # A release call must not cancel a master/PR run or another release invocation.
  group: tests-${{ github.workflow }}-${{ github.event.pull_request.number || inputs.ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/master') }}

jobs:
  frontend:
    name: Frontend build and checks
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: useblacksmith/checkout@0647fdbab2614a5eb86d2971070e325060d91056 # v1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.ref }}
      # Keep setup actions at the workflow revision when validating an older release ref.
      - uses: useblacksmith/checkout@0647fdbab2614a5eb86d2971070e325060d91056 # v1
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
          path: .ci-workflow
          sparse-checkout: .github/actions
      - uses: ./.ci-workflow/.github/actions/setup-php
      - uses: ./.ci-workflow/.github/actions/setup-node
        with:
          browser: 'true'
      - uses: ./.ci-workflow/.github/actions/setup-rust
        with:
          wasm: 'true'
      - name: Verify approved icon catalog
        run: |
          npm run check:icons
          npm run test:icons
      # npm run build preserves WASM -> frontend -> social card generation order.
      - name: Build frontend assets
        run: |
          npm run build
          test -f backend/public/build/manifest.json
          php scripts/release/validate-og.php backend/public/build/og
      - name: Test social card rendering
        run: npm run test:og -- --workers=2
      - name: Check JavaScript
        run: npm run check
      - name: Share compiled frontend
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: test-frontend
          path: |
            backend/public/build/
            transfer-wasm/pkg/
          if-no-files-found: error
          retention-days: 1
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-frontend
          path: test-results/
          if-no-files-found: ignore

  rust:
    name: Rust
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: useblacksmith/checkout@0647fdbab2614a5eb86d2971070e325060d91056 # v1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.ref }}
      - uses: useblacksmith/checkout@0647fdbab2614a5eb86d2971070e325060d91056 # v1
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
          path: .ci-workflow
          sparse-checkout: .github/actions
      - uses: ./.ci-workflow/.github/actions/setup-rust
      - name: Check Rust formatting
        run: |
          cargo fmt --manifest-path encryption/Cargo.toml --check
          cargo fmt --manifest-path transfer/Cargo.toml --check
          cargo fmt --manifest-path transfer-native/Cargo.toml --check
          cargo fmt --manifest-path transfer-wasm/Cargo.toml --check
      - name: Lint Rust
        run: |
          cargo clippy --manifest-path encryption/Cargo.toml --all-targets --locked -- -D warnings
          cargo clippy --manifest-path transfer/Cargo.toml --all-targets --locked -- -D warnings
          cargo clippy --manifest-path transfer-native/Cargo.toml --all-targets --locked -- -D warnings
          cargo clippy --manifest-path transfer-wasm/Cargo.toml --all-targets --locked -- -D warnings
      - name: Test Rust
        run: |
          cargo test --manifest-path encryption/Cargo.toml --locked
          cargo test --manifest-path transfer/Cargo.toml --locked
          cargo test --manifest-path transfer-native/Cargo.toml --locked
          cargo test --manifest-path transfer-wasm/Cargo.toml --locked

  android:
    name: Android
    runs-on: blacksmith-8vcpu-ubuntu-2404
    timeout-minutes: 45
    env:
      FILEBEAM_ANDROID_BUILD_IMAGE: 'false'
      FILEBEAM_ANDROID_CACHE: ${{ github.workspace }}/.android-cache
    steps:
      - uses: useblacksmith/checkout@0647fdbab2614a5eb86d2971070e325060d91056 # v1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.ref }}
      - uses: useblacksmith/setup-docker-builder@19215110ab936351210feebdfa5b440b4493e184 # v2
        with:
          cache-key: docker/android/Dockerfile
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .android-cache/cargo
            .android-cache/gradle/caches
            .android-cache/gradle/wrapper
            client-ffi/target
            client-core/target
          key: android-${{ runner.os }}-rust1.98.0-${{ hashFiles('docker/android/Dockerfile', 'client-ffi/Cargo.lock', 'client-core/Cargo.lock', 'mobile/android/gradle/libs.versions.toml') }}-${{ github.sha }}
          restore-keys: android-${{ runner.os }}-rust1.98.0-${{ hashFiles('docker/android/Dockerfile', 'client-ffi/Cargo.lock', 'client-core/Cargo.lock', 'mobile/android/gradle/libs.versions.toml') }}-
      - name: Build Android tooling
        run: docker buildx build --load --tag filebeam-android-tooling:rust-1.98.0-sdk37 docker/android
      - name: Check native Android build
        run: bash scripts/android/check.sh
      - name: Build API 35 4 KiB emulator
        run: docker buildx build --load --target emulator --build-arg 'SYSTEM_IMAGE=system-images;android-35;google_apis;x86_64' --tag filebeam-android-emulator:api35-4k docker/android
      - name: Build API 35 16 KiB emulator
        run: docker buildx build --load --target emulator --tag filebeam-android-emulator:api35-16k docker/android
      - name: Run full Android instrumentation suite on API 35 4 KiB
        env:
          FILEBEAM_ANDROID_EMULATOR_IMAGE: filebeam-android-emulator:api35-4k
          FILEBEAM_ANDROID_REPORT_DIR: ${{ github.workspace }}/test-results/android/api35-4k
        run: bash scripts/android/device-test.sh
      - name: Run native compatibility suite on API 35 16 KiB
        env:
          FILEBEAM_ANDROID_EMULATOR_IMAGE: filebeam-android-emulator:api35-16k
          FILEBEAM_ANDROID_REPORT_DIR: ${{ github.workspace }}/test-results/android/api35-16k
        run: >-
          bash scripts/android/device-test.sh
          'io.filebeam.android.NativeCoreTest,io.filebeam.android.CheckpointSecretStoreTest,io.filebeam.android.DocumentProviderRecoveryTest,io.filebeam.android.DocumentStorageExportRecoveryTest'
      - name: Upload development APK and test reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: android-development
          path: |
            mobile/android/app/build/outputs/apk/debug/*.apk
            mobile/android/app/build/outputs/apk/androidTest/debug/*.apk
            mobile/android/app/build/reports/
            test-results/android/
          if-no-files-found: ignore
          retention-days: 7

  ios:
    name: iOS
    uses: ./.github/workflows/ios-ci.yml
    with:
      # Preserve the validated release ref when this workflow is called.
      ref: ${{ inputs.ref || github.ref }}

  php-static:
    name: PHP static checks
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: useblacksmith/checkout@0647fdbab2614a5eb86d2971070e325060d91056 # v1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.ref }}
      - uses: useblacksmith/checkout@0647fdbab2614a5eb86d2971070e325060d91056 # v1
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
          path: .ci-workflow
          sparse-checkout: .github/actions
      - uses: ./.ci-workflow/.github/actions/setup-php
      - name: Check PHP formatting
        working-directory: backend
        run: composer lint:check
      - name: Analyze PHP
        working-directory: backend
        run: vendor/bin/phpstan analyse --memory-limit=512M

  php:
    name: PHP (${{ matrix.database }})
    needs: frontend
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - database: SQLite
            configuration: phpunit.xml
          - database: MySQL
            configuration: phpunit.mysql.xml
    services:
      mysql:
        # An empty image disables the service for the SQLite job.
        image: ${{ matrix.database == 'MySQL' && 'mysql:8.4' || '' }}
        env:
          MYSQL_DATABASE: filebeam_testing
          MYSQL_USER: sail
          MYSQL_PASSWORD: password
          MYSQL_ROOT_PASSWORD: password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u sail -ppassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    steps:
      - uses: useblacksmith/checkout@0647fdbab2614a5eb86d2971070e325060d91056 # v1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.ref }}
      - uses: useblacksmith/checkout@0647fdbab2614a5eb86d2971070e325060d91056 # v1
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
          path: .ci-workflow
          sparse-checkout: .github/actions
      - uses: ./.ci-workflow/.github/actions/setup-php
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: test-frontend
          path: .
      - uses: ./.ci-workflow/.github/actions/start-minio
      - name: Test PHP
        working-directory: backend
        env:
          FILEBEAM_TEST_S3_ENDPOINT: http://127.0.0.1:9000
          FILEBEAM_TEST_S3_KEY: filebeam-test
          FILEBEAM_TEST_S3_SECRET: filebeam-test-secret
          FILEBEAM_TEST_S3_BUCKET: filebeam-test
          PHPUNIT_CONFIGURATION: ${{ matrix.configuration }}
        run: vendor/bin/pest --configuration "$PHPUNIT_CONFIGURATION"
      - name: Stop disposable MinIO
        if: always()
        run: docker rm --force filebeam-minio || true

  sail:
    name: Sail (${{ matrix.suite }})
    needs: frontend
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - suite: PostgreSQL and Redis
            shard: ''
          - suite: Browser 1/2
            shard: '1/2'
          - suite: Browser 2/2
            shard: '2/2'
    env:
      SAIL_APP_URL: http://127.0.0.1:8000
      FILEBEAM_CREATIONS_PER_HOUR: '600'
    steps:
      - uses: useblacksmith/checkout@0647fdbab2614a5eb86d2971070e325060d91056 # v1
        with:
          persist-credentials: false
          dissociate: true
          ref: ${{ inputs.ref || github.ref }}
      - uses: useblacksmith/checkout@0647fdbab2614a5eb86d2971070e325060d91056 # v1
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
          path: .ci-workflow
          sparse-checkout: .github/actions
      - uses: ./.ci-workflow/.github/actions/setup-php
      - uses: ./.ci-workflow/.github/actions/setup-node
        if: matrix.shard != ''
        with:
          browser: 'true'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: test-frontend
          path: .
      - uses: ./.ci-workflow/.github/actions/start-minio
        if: matrix.shard == ''
      - name: Validate Sail configuration
        working-directory: backend
        run: docker compose config --quiet
      - name: Match container permissions to runner
        run: printf 'WWWUSER=%s\nWWWGROUP=%s\n' "$(id -u)" "$(id -g)" >> "$GITHUB_ENV"
      - name: Set up cached Sail builder
        uses: useblacksmith/setup-docker-builder@19215110ab936351210feebdfa5b440b4493e184 # v2
        with:
          cache-key: backend/docker/frankenphp/Dockerfile
      - name: Build and start Sail
        working-directory: backend
        run: |
          docker compose build --builder "$(docker buildx inspect --format '{{.Name}}')" laravel.test
          ./vendor/bin/sail up --no-build --detach --wait
      - name: Migrate and seed Sail database
        working-directory: backend
        run: ./vendor/bin/sail artisan migrate --seed --force --no-interaction
      - name: Test PHP with PostgreSQL and Redis
        if: matrix.shard == ''
        working-directory: backend
        run: |
          docker network connect filebeam_sail filebeam-minio
          docker compose exec -T --user sail \
            -e FILEBEAM_TEST_S3_ENDPOINT=http://filebeam-minio:9000 \
            -e FILEBEAM_TEST_S3_KEY=filebeam-test \
            -e FILEBEAM_TEST_S3_SECRET=filebeam-test-secret \
            -e FILEBEAM_TEST_S3_BUCKET=filebeam-test \
            laravel.test vendor/bin/pest --configuration phpunit.sail.xml
      - name: Test Turbo cache with Redis
        if: matrix.shard == ''
        working-directory: backend
        run: docker compose exec -T --user sail -e FILEBEAM_TEST_REDIS_HOST=redis laravel.test vendor/bin/pest --group=redis --configuration phpunit.xml
      - name: Create unhealthy scheduler browser fixture
        if: matrix.shard != ''
        working-directory: backend
        run: |
          docker compose exec -T laravel.test php -r 'foreach (glob("/proc/[0-9]*/cmdline") as $file) { $command = file_get_contents($file); if (str_contains($command, "artisan\0schedule:work")) { posix_kill((int) basename(dirname($file)), 19); } }'
          docker compose exec -T --user sail laravel.test php -r '
            require "vendor/autoload.php";
            $app = require "bootstrap/app.php";
            $app->make(Illuminate\Contracts\Console\Kernel::class)->bootstrap();
            Illuminate\Support\Facades\DB::table("scheduler_heartbeats")->delete();
          '
      - name: Run browser tests
        if: matrix.shard != ''
        env:
          BASE_URL: http://127.0.0.1:8000
          BROWSER_TEST_UNHEALTHY_SCHEDULER: 'true'
          PLAYWRIGHT_SHARD: ${{ matrix.shard }}
        run: npm run test:browser -- --grep-invert @small-chunks --shard="$PLAYWRIGHT_SHARD" --workers=2
      - name: Capture Sail failure logs
        if: failure()
        working-directory: backend
        run: docker compose logs --no-color > "$RUNNER_TEMP/sail.log" 2>&1
      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: sail-artifacts-${{ strategy.job-index }}
          path: |
            test-results/
            playwright-report/
            ${{ runner.temp }}/sail.log
          if-no-files-found: ignore
      - name: Stop Sail
        if: always()
        working-directory: backend
        run: ./vendor/bin/sail down --volumes --remove-orphans
      - name: Stop disposable MinIO
        if: always() && matrix.shard == ''
        run: docker rm --force filebeam-minio || true

  small-chunks:
    name: Small-chunk browser
    needs: frontend
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: useblacksmith/checkout@0647fdbab2614a5eb86d2971070e325060d91056 # v1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.ref }}
      - uses: useblacksmith/checkout@0647fdbab2614a5eb86d2971070e325060d91056 # v1
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
          path: .ci-workflow
          sparse-checkout: .github/actions
      - uses: ./.ci-workflow/.github/actions/setup-php
      - uses: ./.ci-workflow/.github/actions/setup-node
        with:
          browser: 'true'
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: test-frontend
          path: .
      - name: Run small-chunk browser tests
        env:
          APP_ENV: testing
          APP_URL: http://127.0.0.1:8010
          CHUNK_MAX_SIZE: '1040'
          FILEBEAM_CREATIONS_PER_HOUR: '600'
          DB_CONNECTION: sqlite
          DB_DATABASE: ${{ runner.temp }}/filebeam-chunks.sqlite
          CACHE_STORE: array
          SESSION_DRIVER: cookie
          QUEUE_CONNECTION: sync
        run: |
          set -euo pipefail
          server_pid=''
          cleanup() {
            if [[ -n "$server_pid" ]]; then
              kill "$server_pid" 2>/dev/null || true
              wait "$server_pid" 2>/dev/null || true
            fi
          }
          trap cleanup EXIT
          touch "$DB_DATABASE"
          (
            cd backend
            php artisan migrate --seed --force --no-interaction
            exec php artisan serve --host=127.0.0.1 --port=8010 --no-reload
          ) > "${RUNNER_TEMP}/filebeam-chunks.log" 2>&1 &
          server_pid=$!
          for _ in {1..30}; do curl --fail --silent http://127.0.0.1:8010/up && break; sleep 1; done
          curl --fail --silent http://127.0.0.1:8010/up
          BASE_URL=http://127.0.0.1:8010 npx playwright test tests/browser/chunks.spec.ts --config=playwright.config.ts --grep @small-chunks --workers=2
      - name: Upload browser failure artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-small-chunks
          path: |
            test-results/
            playwright-report/
            ${{ runner.temp }}/filebeam-chunks.log
          if-no-files-found: ignore

  distribution:
    name: Distribution and harnesses
    needs: frontend
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: useblacksmith/checkout@0647fdbab2614a5eb86d2971070e325060d91056 # v1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.ref }}
      - uses: useblacksmith/checkout@0647fdbab2614a5eb86d2971070e325060d91056 # v1
        with:
          persist-credentials: false
          ref: ${{ github.workflow_sha }}
          path: .ci-workflow
          sparse-checkout: .github/actions
      - uses: ./.ci-workflow/.github/actions/setup-php
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: test-frontend
          path: .
      - name: Install archive tools
        run: sudo apt-get update && sudo apt-get install --yes zip unzip
      - name: Test updater harness
        run: php tests/updater/run.php
      - name: Test release reference validation
        run: bash scripts/release/validate-ref.test.sh
      - name: Test release publishing safeguards
        run: |
          bash scripts/release/publish.test.sh
          bash scripts/release/github-release.test.sh
      - name: Test Docker lifecycle assertions
        run: bash tests/docker/lifecycle.test.sh
      - name: Test distribution package
        run: |
          bash scripts/release/package.sh v0.0.0 "$RUNNER_TEMP/filebeam-package" --skip-build --allow-unsigned-local
          bash scripts/release/smoke.sh "$RUNNER_TEMP/filebeam-package/filebeam-v0.0.0.zip"

  test:
    # Keep this name in sync with the required GitHub Actions check on master.
    name: Test
    if: always()
    needs: [frontend, rust, android, ios, php-static, php, sail, small-chunks, distribution]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - name: Require every test job to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -e 'length > 0 and all(.[]; .result == "success")' <<< "$RESULTS"
