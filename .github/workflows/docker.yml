name: Docker

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: ${{ matrix.variant }} (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: light
            platform: linux/amd64
            arch: amd64
            runner: blacksmith-4vcpu-ubuntu-2404
          - variant: light
            platform: linux/arm64
            arch: arm64
            runner: blacksmith-4vcpu-ubuntu-2404-arm
          - variant: omnibus
            platform: linux/amd64
            arch: amd64
            runner: blacksmith-4vcpu-ubuntu-2404
          - variant: omnibus
            platform: linux/arm64
            arch: arm64
            runner: blacksmith-4vcpu-ubuntu-2404-arm
    steps:
      - uses: useblacksmith/checkout@0647fdbab2614a5eb86d2971070e325060d91056 # v1
        with:
          persist-credentials: false
          dissociate: true
      - name: Set up cached production builder
        uses: useblacksmith/setup-docker-builder@19215110ab936351210feebdfa5b440b4493e184 # v2
        with:
          # Same workload key in CI and Release; architectures have separate disks.
          cache-key: docker/production/Dockerfile
          platforms: ${{ matrix.platform }}
      - name: Validate build context
        run: scripts/docker/check-context.sh
      - name: Build image
        env:
          FILEBEAM_IMAGE: filebeam-${{ matrix.variant }}:ci-${{ github.sha }}-${{ matrix.arch }}
          FILEBEAM_VERSION: dev-${{ github.sha }}
          FILEBEAM_COMMIT: ${{ github.sha }}
          FILEBEAM_BUILD_METADATA: ci-${{ github.run_number }}.${{ github.run_attempt }}
        run: |
          scripts/docker/build.sh --variant "${{ matrix.variant }}" --platform "${{ matrix.platform }}"
          [[ $(docker image inspect "$FILEBEAM_IMAGE" --format '{{ index .Config.Labels "org.opencontainers.image.source" }}') == https://github.com/Vented-Labs/filebeam ]]
          [[ $(docker image inspect "$FILEBEAM_IMAGE" --format '{{ index .Config.Labels "org.opencontainers.image.version" }}') == "$FILEBEAM_VERSION" ]]
          [[ $(docker image inspect "$FILEBEAM_IMAGE" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}') == "$FILEBEAM_COMMIT" ]]
      - name: Prepare ephemeral Omnibus runner
        if: matrix.variant == 'omnibus'
        run: sudo sysctl -w vm.overcommit_memory=1
      - name: Test image
        env:
          FILEBEAM_IMAGE: filebeam-${{ matrix.variant }}:ci-${{ github.sha }}-${{ matrix.arch }}
        run: |
          scripts/docker/test.sh --variant "${{ matrix.variant }}" --suite full
