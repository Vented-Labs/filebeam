name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing strict SemVer tag to validate and release
        required: true
        type: string
      publish:
        description: Publish a package or metadata change
        required: true
        default: false
        type: boolean
      metadata_only:
        description: Change catalog metadata without uploading artifacts
        required: true
        default: false
        type: boolean
      security_release:
        description: Security release classification (true, false, or preserve)
        required: false
        default: preserve
        type: choice
        options: [preserve, 'true', 'false']
      withdrawn:
        description: Withdrawal classification (true, false, or preserve)
        required: false
        default: preserve
        type: choice
        options: [preserve, 'true', 'false']
      notes_url:
        description: Release notes URL; leave empty to preserve
        required: false
        type: string

permissions:
  contents: read

jobs:
  cli:
    if: (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.publish && !inputs.metadata_only)) && needs.validate-ref.result == 'success'
    needs: [test, validate-ref]
    permissions:
      contents: write
    uses: ./.github/workflows/beam.yml
    with:
      tag: ${{ needs.validate-ref.outputs.tag }}
      publish: true
    secrets: inherit
  test:
    if: github.event_name != 'schedule' && needs.validate-ref.result == 'success'
    needs: validate-ref
    uses: ./.github/workflows/tests.yml
    with:
      ref: ${{ needs.validate-ref.outputs.commit }}

  validate-ref:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.verify.outputs.tag }}
      commit: ${{ steps.verify.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: refs/heads/master
          fetch-depth: 0
          fetch-tags: true
      - id: verify
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          chmod +x scripts/release/validate-ref.sh
          commit=$(scripts/release/validate-ref.sh "$RELEASE_TAG")
          printf 'tag=%s\ncommit=%s\n' "$RELEASE_TAG" "$commit" >> "$GITHUB_OUTPUT"

  package:
    if: github.event_name != 'schedule' && !(github.event_name == 'workflow_dispatch' && inputs.metadata_only) && needs.validate-ref.result == 'success'
    needs: [test, validate-ref]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      RELEASE_TAG: ${{ needs.validate-ref.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.validate-ref.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_COMMIT }}
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          extensions: curl, zip, sodium, mbstring, dom, pdo_sqlite
          coverage: none
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
          cache: npm
      - run: rustup toolchain install 1.98.0 --profile minimal && rustup default 1.98.0 && rustup target add wasm32-unknown-unknown && cargo install wasm-pack --version 0.15.0 --locked
      - run: sudo apt-get update && sudo apt-get install --yes zip unzip
      - run: npm ci
      - name: Install Playwright Chromium
        run: |
          # Avoid unrelated Chrome repository index races during Ubuntu dependency installation.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list /etc/apt/sources.list.d/google-chrome.sources
          npx playwright install --with-deps chromium
      - name: Prepare Laravel writable directories
        working-directory: backend
        run: mkdir -p bootstrap/cache storage/app/private storage/app/public storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs
      - working-directory: backend
        run: composer install --no-interaction --prefer-dist --no-progress
      - run: chmod +x scripts/release/package.sh scripts/release/publish.sh
      - run: scripts/release/package.sh "$RELEASE_TAG" dist/release
        env:
          RELEASE_PUBLIC_KEY: ${{ secrets.RELEASE_PUBLIC_KEY }}
      - run: |
          [[ $(git rev-parse HEAD) == "$RELEASE_COMMIT" ]]
          php scripts/release/verify-release.php dist/release/release.json "$RELEASE_TAG" "$RELEASE_COMMIT"
      - run: scripts/release/smoke.sh "dist/release/filebeam-$RELEASE_TAG.zip"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-${{ env.RELEASE_TAG }}
          path: dist/release/
          if-no-files-found: error

  publish:
    if: (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && inputs.publish && !inputs.metadata_only)) && needs.validate-ref.result == 'success'
    needs: [package, validate-ref]
    runs-on: ubuntu-latest
    environment: release
    env:
      RELEASE_TAG: ${{ needs.validate-ref.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.validate-ref.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: refs/heads/master
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ env.RELEASE_TAG }}
          path: dist/release
      - run: php scripts/release/verify-release.php dist/release/release.json "$RELEASE_TAG" "$RELEASE_COMMIT"
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          extensions: sodium, zip
          coverage: none
      - run: sudo apt-get update && sudo apt-get install --yes unzip
      - run: chmod +x scripts/release/publish.sh
      - run: scripts/release/publish.sh "$RELEASE_TAG" dist/release
        env:
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RELEASE_PUBLIC_KEY: ${{ secrets.RELEASE_PUBLIC_KEY }}
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}

  metadata:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && inputs.publish && inputs.metadata_only && needs.validate-ref.result == 'success'
    needs: validate-ref
    runs-on: ubuntu-latest
    environment: release
    env:
      RELEASE_TAG: ${{ needs.validate-ref.outputs.tag }}
      SECURITY_RELEASE: ${{ inputs.security_release }}
      WITHDRAWN: ${{ inputs.withdrawn }}
      NOTES_URL: ${{ inputs.notes_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: refs/heads/master
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          extensions: sodium
          coverage: none
      - run: chmod +x scripts/release/publish.sh
      - run: scripts/release/publish.sh "$RELEASE_TAG" --metadata-only --security-release="$SECURITY_RELEASE" --withdrawn="$WITHDRAWN" --notes-url="$NOTES_URL"
        env:
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RELEASE_PUBLIC_KEY: ${{ secrets.RELEASE_PUBLIC_KEY }}
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}

  refresh-catalog:
    if: github.event_name == 'schedule' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: refs/heads/master
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          extensions: sodium
          coverage: none
      - run: chmod +x scripts/release/publish.sh
      - run: scripts/release/publish.sh --refresh-index
        env:
          R2_ENDPOINT_URL: ${{ secrets.R2_ENDPOINT_URL }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          RELEASE_PUBLIC_KEY: ${{ secrets.RELEASE_PUBLIC_KEY }}
          RELEASE_SIGNING_KEY: ${{ secrets.RELEASE_SIGNING_KEY }}

  docker-plan:
    if: (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && inputs.publish && !inputs.metadata_only)) && needs.validate-ref.result == 'success'
    needs: validate-ref
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.tags.outputs.revision }}
      advance_aliases: ${{ steps.tags.outputs.advance_aliases }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: refs/heads/master
          fetch-depth: 0
          fetch-tags: true
      - id: tags
        env:
          RELEASE_TAG: ${{ needs.validate-ref.outputs.tag }}
        run: |
          mapfile -t tags < <(git tag -l | while IFS= read -r tag; do [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] && printf '%s\n' "$tag"; done | sort -V)
          latest_tag="${tags[${#tags[@]} - 1]}"
          [[ -n "$latest_tag" ]]
          printf 'revision=%s-build-%s.%s\n' "$RELEASE_TAG" "$GITHUB_RUN_NUMBER" "$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          if [[ "$RELEASE_TAG" == "$latest_tag" ]]; then
            printf 'advance_aliases=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'advance_aliases=false\n' >> "$GITHUB_OUTPUT"
          fi

  docker-build:
    if: needs.docker-plan.result == 'success' && needs.test.result == 'success'
    needs: [test, validate-ref, docker-plan]
    permissions:
      contents: read
      packages: write
      id-token: write
    environment: release
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: light
            image: ghcr.io/vented-labs/filebeam/light
            platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - variant: light
            image: ghcr.io/vented-labs/filebeam/light
            platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
          - variant: omnibus
            image: ghcr.io/vented-labs/filebeam/omnibus
            platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - variant: omnibus
            image: ghcr.io/vented-labs/filebeam/omnibus
            platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 35
    env:
      RELEASE_COMMIT: ${{ needs.validate-ref.outputs.commit }}
      IMAGE: ${{ matrix.image }}
      IMAGE_TAG: ${{ needs.docker-plan.outputs.revision }}-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_COMMIT }}
      - name: Create ephemeral Buildx builder
        run: |
          builder="filebeam-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ matrix.variant }}-${{ matrix.arch }}"
          docker buildx create --name "$builder" --driver docker-container --use
          docker buildx inspect --bootstrap
          printf 'FILEBEAM_BUILDER=%s\n' "$builder" >> "$GITHUB_ENV"
      - name: Log in to GHCR
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '::add-mask::%s\n' "$GHCR_TOKEN"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin
      - name: Install Cosign
        run: bash scripts/ci/install-release-tools.sh "${{ matrix.arch }}"
      - name: Validate build context
        run: scripts/docker/check-context.sh
      - name: Build immutable platform image
        env:
          FILEBEAM_IMAGE: ${{ env.IMAGE }}:${{ env.IMAGE_TAG }}
          FILEBEAM_PUSH: 'true'
          FILEBEAM_PROVENANCE: mode=max
          FILEBEAM_SBOM: 'true'
          FILEBEAM_VERSION: ${{ needs.validate-ref.outputs.tag }}
          FILEBEAM_COMMIT: ${{ needs.validate-ref.outputs.commit }}
          FILEBEAM_BUILD_METADATA: ${{ needs.docker-plan.outputs.revision }}
        run: scripts/docker/build.sh --variant "${{ matrix.variant }}" --platform "${{ matrix.platform }}"
      - name: Prepare ephemeral Omnibus runner
        if: matrix.variant == 'omnibus'
        run: sudo sysctl -w vm.overcommit_memory=1
      - id: digest
        name: Resolve tested staging image digest
        run: printf 'digest=%s\n' "$(docker buildx imagetools inspect "$IMAGE:$IMAGE_TAG" --format '{{.Manifest.Digest}}')" >> "$GITHUB_OUTPUT"
      - name: Test published artifact
        env:
          FILEBEAM_IMAGE: ${{ env.IMAGE }}@${{ steps.digest.outputs.digest }}
          EXPECTED_VERSION: ${{ needs.validate-ref.outputs.tag }}
          EXPECTED_REVISION: ${{ needs.validate-ref.outputs.commit }}
        run: |
          docker pull "$FILEBEAM_IMAGE"
          [[ $(docker image inspect "$FILEBEAM_IMAGE" --format '{{ index .Config.Labels "org.opencontainers.image.source" }}') == https://github.com/Vented-Labs/filebeam ]]
          [[ $(docker image inspect "$FILEBEAM_IMAGE" --format '{{ index .Config.Labels "org.opencontainers.image.version" }}') == "$EXPECTED_VERSION" ]]
          [[ $(docker image inspect "$FILEBEAM_IMAGE" --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}') == "$EXPECTED_REVISION" ]]
          scripts/docker/test.sh --variant "${{ matrix.variant }}" --suite full
      - name: Sign platform image
        run: cosign sign --yes "$IMAGE@${{ steps.digest.outputs.digest }}"
      - name: Remove ephemeral Buildx builder
        if: always()
        run: docker buildx rm "$FILEBEAM_BUILDER" || true

  docker-publish:
    if: needs.docker-build.result == 'success'
    needs: [validate-ref, docker-plan, docker-build]
    permissions:
      contents: read
      packages: write
      id-token: write
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RELEASE_TAG: ${{ needs.validate-ref.outputs.tag }}
      REVISION: ${{ needs.docker-plan.outputs.revision }}
      ADVANCE_ALIASES: ${{ needs.docker-plan.outputs.advance_aliases }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ needs.validate-ref.outputs.commit }}
      - name: Create ephemeral Buildx builder
        run: |
          builder="filebeam-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-publish"
          docker buildx create --name "$builder" --driver docker-container --use
          docker buildx inspect --bootstrap
          printf 'FILEBEAM_BUILDER=%s\n' "$builder" >> "$GITHUB_ENV"
      - name: Log in to GHCR
        env:
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '::add-mask::%s\n' "$GHCR_TOKEN"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_USERNAME" --password-stdin
      - name: Install Cosign
        run: bash scripts/ci/install-release-tools.sh
      - name: Publish multi-architecture manifests
        run: |
          platform_digest() {
            docker buildx imagetools inspect "$1" --raw | jq -er --arg arch "$2" '
              [.manifests[] | select(.platform.os == "linux" and .platform.architecture == $arch and (.annotations["vnd.docker.reference.type"] // "") != "attestation-manifest") | .digest]
              | if length == 1 then .[0] else error("expected one " + $arch + " platform manifest") end
            '
          }
          attestation_digests() {
            docker buildx imagetools inspect "$1" --raw | jq -er '
              .manifests[] | select((.annotations["vnd.docker.reference.type"] // "") == "attestation-manifest") | .digest
            '
          }

          for variant in light omnibus; do
            image="ghcr.io/vented-labs/filebeam/$variant"
            amd64_ref="$image:$REVISION-amd64"
            arm64_ref="$image:$REVISION-arm64"
            amd64_digest=$(platform_digest "$amd64_ref" amd64)
            arm64_digest=$(platform_digest "$arm64_ref" arm64)
            mapfile -t amd64_attestations < <(attestation_digests "$amd64_ref")
            mapfile -t arm64_attestations < <(attestation_digests "$arm64_ref")
            ((${#amd64_attestations[@]} > 0 && ${#arm64_attestations[@]} > 0))

            # Buildx flattens the two staged indexes into one index while retaining attestations.
            docker buildx imagetools create --tag "$image:$REVISION" "$amd64_ref" "$arm64_ref"
            index_digest=$(docker buildx imagetools inspect "$image:$REVISION" --format '{{.Manifest.Digest}}')
            [[ $(platform_digest "$image@$index_digest" amd64) == "$amd64_digest" ]]
            [[ $(platform_digest "$image@$index_digest" arm64) == "$arm64_digest" ]]
            final_attestations=$(attestation_digests "$image@$index_digest")
            for digest in "${amd64_attestations[@]}" "${arm64_attestations[@]}"; do
              grep -Fqx "$digest" <<<"$final_attestations"
            done

            cosign sign --yes "$image@$index_digest"
            cosign verify \
              --certificate-identity-regexp '^https://github.com/Vented-Labs/filebeam/' \
              --certificate-oidc-issuer 'https://token.actions.githubusercontent.com' \
              "$image@$index_digest" >/dev/null
            if [[ "$ADVANCE_ALIASES" == true ]]; then
              major_minor="${RELEASE_TAG%.*}"
              major="${RELEASE_TAG%%.*}"
              docker buildx imagetools create --tag "$image:$RELEASE_TAG" --tag "$image:$major_minor" --tag "$image:$major" --tag "$image:latest" "$image:$REVISION"
            fi
          done
      - name: Remove ephemeral Buildx builder
        if: always()
        run: docker buildx rm "$FILEBEAM_BUILDER" || true

  github-release:
    if: (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/master' && inputs.publish && !inputs.metadata_only)) && needs.package.result == 'success' && needs.publish.result == 'success' && needs.docker-publish.result == 'success' && needs.validate-ref.result == 'success'
    needs: [package, publish, docker-publish, validate-ref]
    permissions:
      contents: write
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RELEASE_TAG: ${{ needs.validate-ref.outputs.tag }}
      RELEASE_COMMIT: ${{ needs.validate-ref.outputs.commit }}
      GH_REPO: ${{ github.repository }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ env.RELEASE_COMMIT }}
          fetch-depth: 0
          fetch-tags: true
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-${{ env.RELEASE_TAG }}
          path: dist/release
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: '8.5'
          coverage: none
      - name: Publish verified GitHub release
        run: scripts/release/github-release.sh "$RELEASE_TAG" "$RELEASE_COMMIT" dist/release
