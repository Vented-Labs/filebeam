name: Prepare Rust
description: Install the pinned Rust toolchain, transfer crates, and wasm-pack
inputs:
  wasm:
    description: Install the WASM target and wasm-pack
    default: 'false'
runs:
  using: composite
  steps:
    - name: Install toolchain
      shell: bash
      run: |
        rustup toolchain install 1.98.0 --profile minimal --component rustfmt --component clippy
        rustup default 1.98.0
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: |
          ~/.cargo/registry
          ~/.cargo/git
          crates/encryption/target
          crates/transfer/target
          crates/transfer-native/target
          crates/transfer-wasm/target
        key: cargo-${{ runner.os }}-${{ runner.arch }}-1.98.0-wasm${{ inputs.wasm }}-${{ hashFiles('crates/encryption/Cargo.lock', 'crates/transfer/Cargo.lock', 'crates/transfer-native/Cargo.lock', 'crates/transfer-wasm/Cargo.lock') }}-${{ hashFiles('crates/encryption/src/**', 'crates/encryption/Cargo.toml', 'crates/transfer/src/**', 'crates/transfer/Cargo.toml', 'crates/transfer-native/src/**', 'crates/transfer-native/Cargo.toml', 'crates/transfer-wasm/src/**', 'crates/transfer-wasm/Cargo.toml') }}
        restore-keys: |
          cargo-${{ runner.os }}-${{ runner.arch }}-1.98.0-wasm${{ inputs.wasm }}-${{ hashFiles('crates/encryption/Cargo.lock', 'crates/transfer/Cargo.lock', 'crates/transfer-native/Cargo.lock', 'crates/transfer-wasm/Cargo.lock') }}-
          cargo-${{ runner.os }}-${{ runner.arch }}-1.98.0-wasm${{ inputs.wasm }}-
    - name: Cache wasm-pack
      if: inputs.wasm == 'true'
      id: wasm-pack
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cargo/bin/wasm-pack
        key: wasm-pack-${{ runner.os }}-${{ runner.arch }}-rust1.98.0-v0.15.0
    - name: Install WASM tools
      if: inputs.wasm == 'true'
      shell: bash
      env:
        WASM_PACK_CACHE_HIT: ${{ steps.wasm-pack.outputs.cache-hit }}
      run: |
        rustup target add wasm32-unknown-unknown
        if [[ "$WASM_PACK_CACHE_HIT" != true ]]; then
          cargo install wasm-pack --version 0.15.0 --locked --force
        fi
