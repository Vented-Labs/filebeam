name: Prepare PHP application
description: Install PHP dependencies and prepare an isolated Laravel environment
inputs:
  gd:
    description: Enable the optional custom-theme image capability
    default: 'true'
runs:
  using: composite
  steps:
    # Self-hosted runners install PHP from apt, and Ubuntu mirrors intermittently serve
    # packages at ~100 kB/s. Reuse the packages earlier runs downloaded.
    - name: Restore PHP packages
      id: php-packages
      if: runner.os == 'Linux'
      uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/filebeam-apt/php/*.deb
        key: apt-php85-gd${{ inputs.gd }}-${{ runner.os }}-${{ runner.arch }}-
        restore-keys: apt-php85-gd${{ inputs.gd }}-${{ runner.os }}-${{ runner.arch }}-
    - name: Use cached PHP packages
      if: runner.os == 'Linux'
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/../apt-archives.sh" use ~/.cache/filebeam-apt/php
    - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
      with:
        php-version: '8.5'
        extensions: mbstring, dom, curl, sodium, zip, pdo_sqlite, pdo_mysql, pdo_pgsql, redis, ${{ inputs.gd == 'true' && 'gd' || ':gd' }}
        coverage: none
    - name: Collect PHP packages
      id: php-packages-key
      if: runner.os == 'Linux'
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/../apt-archives.sh" finish ~/.cache/filebeam-apt/php 'apt-php85-gd${{ inputs.gd }}-${{ runner.os }}-${{ runner.arch }}-' >> "$GITHUB_OUTPUT"
    - name: Save PHP packages
      if: runner.os == 'Linux' && steps.php-packages-key.outputs.key != steps.php-packages.outputs.cache-matched-key
      uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/filebeam-apt/php/*.deb
        key: ${{ steps.php-packages-key.outputs.key }}
    - name: Locate Composer cache
      id: composer-cache
      shell: bash
      working-directory: backend
      run: printf 'path=%s\n' "$(composer config cache-files-dir)" >> "$GITHUB_OUTPUT"
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.composer-cache.outputs.path }}
        key: composer-${{ runner.os }}-${{ runner.arch }}-php85-${{ hashFiles('backend/composer.lock') }}
        restore-keys: composer-${{ runner.os }}-${{ runner.arch }}-php85-
    - name: Prepare Laravel
      shell: bash
      working-directory: backend
      env:
        SAIL_APP_URL: http://127.0.0.1:8000
      run: |
        mkdir -p bootstrap/cache storage/app/private storage/app/public storage/framework/cache/data storage/framework/sessions storage/framework/views storage/logs
        composer install --no-interaction --prefer-dist --no-progress
        cp .env.example .env
        # Sail sources .env, overriding exported values.
        sed -i "s|^SAIL_APP_URL=.*|SAIL_APP_URL=${SAIL_APP_URL}|" .env
        php artisan key:generate --force --no-interaction
