[package]
name = "filebeam-client-core"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Shared client jobs for Filebeam's native applications"

[dependencies]
anyhow = "1.0.98"
base64 = "0.22.1"
filebeam-encryption = { path = "../encryption" }
filebeam-transfer-native = { path = "../transfer-native" }
filebeam-transfer = { path = "../transfer" }
reqwest = { version = "0.12.20", default-features = false, features = ["blocking", "cookies", "json", "rustls-tls"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.11.0"
zeroize = "1.8.1"
tokio = { version = "1.48.0", features = ["time"] }
